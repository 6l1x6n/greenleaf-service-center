name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Парсер пушит через GITHUB_TOKEN — событие push для таких пушей GitHub не создаёт,
  # поэтому деплоим после завершения прогона парсера (каталог обновляется на сайте).
  workflow_run:
    workflows: ["Parse catalog"]
    types: [completed]
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # После упавшего парсинга не деплоим: каталог мог остаться пустым
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Write version.json
        run: |
          echo "{\"commit\":\"$GITHUB_SHA\",\"short\":\"$(echo $GITHUB_SHA | cut -c1-8)\",\"deployedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > public/version.json
          cat public/version.json

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npx wrangler deploy

      - name: Verify production
        run: bash scripts/verify.sh
