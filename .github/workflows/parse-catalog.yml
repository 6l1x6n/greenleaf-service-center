name: Parse catalog

on:
  schedule:
    # Астана (UTC+5): каждые 2 часа днём — 10:00, 12:00, 14:00, 16:00,
    # 18:00, 20:00, 22:00 и 00:00 → UTC 05:00, 07:00, 09:00, 11:00, 13:00,
    # 15:00, 17:00, 19:00. Прогоны «умные»: существующие товары — только
    # количества, новые артикулы создаются с полными данными один раз.
    # Защита портала: случайная задержка 0–3 мин + паузы между действиями.
    - cron: "0 5,7,9,11,13,15,17,19 * * *"
  workflow_dispatch:
    inputs:
      skip_delay:
        description: "Пропустить случайную задержку (для отладки)"
        type: boolean
        default: false
      full:
        description: "Полный прогон (перезапись названий/цен/фото существующих карточек)"
        type: boolean
        default: false
      task:
        description: "Что запустить (по расписанию всегда all)"
        type: choice
        default: all
        options:
          - all
          - products
          - deliveries

permissions:
  contents: write

concurrency:
  group: parse-catalog
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/parser/requirements.txt
          python -m playwright install chromium --with-deps

      - name: Check secrets
        env:
          SC_LOGIN: ${{ secrets.SC_LOGIN }}
          SC_PASSWORD: ${{ secrets.SC_PASSWORD }}
        run: |
          if [ -z "$SC_LOGIN" ]; then
            echo "::error::Секрет SC_LOGIN не задан (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          if [ -z "$SC_PASSWORD" ]; then
            echo "::error::Секрет SC_PASSWORD не задан (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Random delay (защита от блокировок портала)
        if: ${{ !inputs.skip_delay }}
        run: sleep $((RANDOM % 180))

      - name: Run parser
        env:
          SC_LOGIN: ${{ secrets.SC_LOGIN }}
          SC_PASSWORD: ${{ secrets.SC_PASSWORD }}
        run: python scripts/parser/parser.py ${{ github.event.inputs.task == 'deliveries' && '--moves-only' || '' }} ${{ github.event.inputs.full == 'true' && '--full' || '' }}

      - name: Upload diag (если парсер что-то сохранил)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-diag
          path: scripts/parser/diag/
          if-no-files-found: ignore

      - name: Commit catalog if changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add public/data/products.base.json public/data/moves.json public/data/store-stock.json public/assets/images/products
          if git diff --cached --quiet; then
            echo "Каталог не изменился — коммит не нужен"
          else
            git commit -m "Обновление каталога: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
