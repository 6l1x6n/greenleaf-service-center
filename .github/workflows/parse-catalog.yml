name: Parse catalog

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: parse-catalog
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/parser/requirements.txt
          python -m playwright install chromium --with-deps

      - name: Random delay (защита от блокировок портала)
        run: sleep $((RANDOM % 900))

      - name: Run parser
        env:
          SC_LOGIN: ${{ secrets.SC_LOGIN }}
          SC_PASSWORD: ${{ secrets.SC_PASSWORD }}
          PARTNER_LOGIN: ${{ secrets.PARTNER_LOGIN }}
        run: python scripts/parser/parser.py

      - name: Commit catalog if changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add public/data/products.json public/assets/images/products
          if git diff --cached --quiet; then
            echo "Каталог не изменился — коммит не нужен"
          else
            git commit -m "Обновление каталога: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
