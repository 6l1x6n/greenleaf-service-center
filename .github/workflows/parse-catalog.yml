name: Parse catalog

on:
  schedule:
    # Астана (UTC+5): 08:00, 10:00, 12:00, 14:00, 16:00, 18:00 →
    # UTC 03:00, 05:00, 07:00, 09:00, 11:00, 13:00.
    # Ночью и поздно вечером парсер НЕ работает: с 21:00 до ~02:00 программа
    # забивки PV работает в кабинете сервис-центра (создаёт корзины) — парс
    # в это время конфликтует. Последний прогон 18:00 (~18:10 завершение),
    # до начала забивки PV остаётся почти 3 часа. Прогоны «умные»: существующие
    # товары — только количества, новые артикулы создаются один раз.
    # Защита портала: случайная задержка 0–3 мин + паузы между действиями.
    - cron: "0 3,5,7,9,11,13 * * *"
  workflow_dispatch:
    inputs:
      skip_delay:
        description: "Пропустить случайную задержку (для отладки)"
        type: boolean
        default: false
      full:
        description: "Полный прогон (перезапись названий/цен/фото существующих карточек)"
        type: boolean
        default: false
      rephotos:
        description: "Перекачать ВСЕ фото товаров разово в исходном разрешении (без сжатия)"
        type: boolean
        default: false
      task:
        description: "Что запустить (по расписанию всегда all)"
        type: choice
        default: all
        options:
          - all
          - products
          - deliveries

permissions:
  contents: write

concurrency:
  group: parse-catalog
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/parser/requirements.txt
          python -m playwright install chromium --with-deps

      - name: Check secrets
        env:
          SC_LOGIN: ${{ secrets.SC_LOGIN }}
          SC_PASSWORD: ${{ secrets.SC_PASSWORD }}
        run: |
          if [ -z "$SC_LOGIN" ]; then
            echo "::error::Секрет SC_LOGIN не задан (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          if [ -z "$SC_PASSWORD" ]; then
            echo "::error::Секрет SC_PASSWORD не задан (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Random delay (защита от блокировок портала)
        if: ${{ !inputs.skip_delay }}
        run: sleep $((RANDOM % 180))

      - name: Run parser
        env:
          SC_LOGIN: ${{ secrets.SC_LOGIN }}
          SC_PASSWORD: ${{ secrets.SC_PASSWORD }}
        run: python scripts/parser/parser.py ${{ github.event.inputs.task == 'deliveries' && '--moves-only' || '' }} ${{ github.event.inputs.full == 'true' && '--full' || '' }} ${{ github.event.inputs.rephotos == 'true' && '--rephotos' || '' }}

      - name: Upload diag (если парсер что-то сохранил)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-diag
          path: scripts/parser/diag/
          if-no-files-found: ignore

      - name: Commit catalog if changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add public/data/products.base.json public/data/moves.json public/data/store-stock.json public/assets/images/products
          git add scripts/parser/.rephotos_pending || true
          git add scripts/parser/.photo_backfill_pending || true
          if git diff --cached --quiet; then
            echo "Каталог не изменился — коммит не нужен"
          else
            git commit -m "Обновление каталога: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
