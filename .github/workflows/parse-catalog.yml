name: Parse catalog

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      skip_delay:
        description: "Пропустить случайную задержку (для отладки)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: parse-catalog
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/parser/requirements.txt
          python -m playwright install chromium --with-deps

      - name: Check secrets
        env:
          SC_LOGIN: ${{ secrets.SC_LOGIN }}
          SC_PASSWORD: ${{ secrets.SC_PASSWORD }}
        run: |
          if [ -z "$SC_LOGIN" ]; then
            echo "::error::Секрет SC_LOGIN не задан (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          if [ -z "$SC_PASSWORD" ]; then
            echo "::error::Секрет SC_PASSWORD не задан (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Random delay (защита от блокировок портала)
        if: ${{ !inputs.skip_delay }}
        run: sleep $((RANDOM % 180))

      - name: Run parser
        env:
          SC_LOGIN: ${{ secrets.SC_LOGIN }}
          SC_PASSWORD: ${{ secrets.SC_PASSWORD }}
        run: python scripts/parser/parser.py

      - name: Upload diag (если парсер что-то сохранил)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-diag
          path: scripts/parser/diag/
          if-no-files-found: ignore

      - name: Commit catalog if changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add public/data/products.json public/data/moves.json public/data/store-stock.json public/assets/images/products
          if git diff --cached --quiet; then
            echo "Каталог не изменился — коммит не нужен"
          else
            git commit -m "Обновление каталога: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
